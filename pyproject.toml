[project]
name = "document-scanner"
version = "0.1.0"
description = "Turn a photo of a document into a flat, clean scan."
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "pillow>=12.1.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
